name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Re-runs if you edit this file
  workflow_dispatch: # Lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=HammasT1&theme=dark&background=1a1b26&border=b19cd9&ring=b19cd9&fire=b19cd9&currStreakLabel=b19cd9&sideLabels=ffffff&currStreakNum=ffffff&sideNums=ffffff&dates=8b8b9e&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
